services:
  trackswipe:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TRACKSWIPE_DATA: /data
    volumes:
      - ./data:/data:Z
      # To use another Fedora music folder, add its mount here and select
      # /music in Settings. Use :z when sharing it with other containers.
      # - /hdd/Music:/music:Z
    restart: unless-stopped
    stop_grace_period: 30s
