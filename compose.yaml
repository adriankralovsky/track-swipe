services:
  trackswipe:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TRACKSWIPE_DATA: /data
    volumes:
      - ./data:/data
      # To use an existing music library, mount it and select /music in Settings.
      # - /path/to/your/Music:/music
      # SELinux hosts: use :Z for private data, :z for a shared music directory.
    restart: unless-stopped
    stop_grace_period: 30s
